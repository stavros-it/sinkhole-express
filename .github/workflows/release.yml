name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter keyring pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller --onefile --windowed
          --icon sinkhole_express.ico
          --name SinkholeExpress
          --add-data "sinkhole_express.ico;."
          --collect-data customtkinter
          sinkhole_express_ctk.pyw

      - name: Verify build output
        run: |
          if (Test-Path dist\SinkholeExpress.exe) {
            $size = (Get-Item dist\SinkholeExpress.exe).Length
            Write-Output "Built SinkholeExpress.exe ($size bytes)"
          } else {
            Write-Error "SinkholeExpress.exe was not produced"
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SinkholeExpress-windows
          path: dist/SinkholeExpress.exe
          if-no-files-found: error

      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create ${{ github.ref_name }} dist\SinkholeExpress.exe
          --title ${{ github.ref_name }}
          --generate-notes
          --notes "Portable Windows build of Sinkhole Express. Requires Pi-hole v6 with the REST API enabled. Download, double-click, and configure host/port/password in Settings."
